<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="membershipHeroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92"/>
      <stop offset="50%" stop-color="#1e3a8a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#0f172a"/>
  
  <!-- Professional Team Meeting / Modern Workspace Graphic Illustration -->
  <g transform="translate(150, 80)">
    <!-- Modern Office Interior Elements -->
    <rect x="50" y="50" width="800" height="350" rx="20" fill="#1e293b" opacity="0.6"/>
    
    {/* Floating Success Cards & Collaboration Nodes */}
    <rect x="100" y="100" width="220" height="120" rx="12" fill="rgba(37, 99, 235, 0.2)" stroke="#3b82f6" stroke-width="2"/>
    <text x="210" y="150" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">🚀 Young Leaders</text>
    <text x="210" y="180" font-family="sans-serif" font-size="13" fill="#93c5fd" text-anchor="middle">Empowering Africa's Future</text>

    <rect x="580" y="100" width="220" height="120" rx="12" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="2"/>
    <text x="690" y="150" font-family="sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">💡 Innovation</text>
    <text x="690" y="180" font-family="sans-serif" font-size="13" fill="#6ee7b7" text-anchor="middle">Ideas into Action</text>

    <!-- Center Badge -->
    <circle cx="450" cy="180" r="60" fill="url(#goldGlow)" opacity="0.9"/>
    <text x="450" y="188" font-family="sans-serif" font-weight="900" font-size="28" fill="#0f172a" text-anchor="middle">B-DOERS</text>
  </g>

  <!-- Dark Overlay Gradient -->
  <rect width="1200" height="600" fill="url(#membershipHeroGrad)"/>
</svg>