<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="busBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#busBg)"/>
  
  <rect x="30" y="30" width="340" height="340" rx="12" fill="none" stroke="#34d399" stroke-width="2" opacity="0.3"/>

  <!-- Top Title -->
  <text x="200" y="70" font-family="sans-serif" font-weight="900" font-size="28" fill="#34d399" text-anchor="middle">STRATEGIC</text>
  <text x="200" y="105" font-family="sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle">BUSINESS MANAGEMENT</text>

  <!-- Graphic: Growth Chart & Briefcase -->
  <g transform="translate(130, 140)">
    <rect x="0" y="40" width="140" height="90" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
    <path d="M40 40 L40 25 A 30 30 0 0 1 100 25 L100 40" fill="none" stroke="#34d399" stroke-width="2"/>
    <!-- Growth Bars -->
    <rect x="25" y="85" width="20" height="30" fill="#34d399" rx="2"/>
    <rect x="55" y="65" width="20" height="50" fill="#34d399" rx="2"/>
    <rect x="85" y="50" width="20" height="65" fill="#facc15" rx="2"/>
  </g>

  <!-- Subtitle -->
  <text x="200" y="295" font-family="sans-serif" font-weight="700" font-size="16" fill="#facc15" text-anchor="middle">Scaling for Public Sector &amp; NGOs</text>
  <text x="200" y="325" font-family="sans-serif" font-size="12" fill="#e2e8f0" text-anchor="middle">Frameworks for Sustainable Impact</text>
</svg>