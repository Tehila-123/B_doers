<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <linearGradient id="titleBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#4d7c0f"/>
    </linearGradient>
  </defs>

  <!-- Background Sky -->
  <rect width="400" height="400" fill="url(#skyGrad)"/>

  <!-- Decorative Stars & Sparkles -->
  <circle cx="40" cy="40" r="3" fill="#3b82f6"/>
  <circle cx="360" cy="50" r="4" fill="#ef4444"/>
  <circle cx="320" cy="20" r="3" fill="#10b981"/>

  <!-- Top Title Banner -->
  <text x="200" y="55" font-family="'Comic Sans MS', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#0369a1" text-anchor="middle">KINYARWANDA</text>
  
  <!-- Green Ribbon Box -->
  <rect x="30" y="70" width="340" height="30" rx="6" fill="url(#titleBg)"/>
  <text x="200" y="90" font-family="sans-serif" font-weight="bold" font-size="13" fill="#ffffff" text-anchor="middle">Amagambo Akoroshwa Ku Isoko Ku Bana (Imyaka 8-12)</text>

  <text x="200" y="125" font-family="sans-serif" font-weight="800" font-size="20" fill="#0f172a" text-anchor="middle">PART 2</text>

  <!-- Icon Badges Row -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="55" height="35" rx="6" fill="#15803d"/>
    <text x="27" y="22" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">📖</text>

    <rect x="75" y="0" width="55" height="35" rx="6" fill="#0284c7"/>
    <text x="102" y="22" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">💬</text>

    <rect x="150" y="0" width="55" height="35" rx="6" fill="#d97706"/>
    <text x="177" y="22" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">✍️</text>

    <rect x="225" y="0" width="55" height="35" rx="6" fill="#dc2626"/>
    <text x="252" y="22" font-family="sans-serif" font-size="16" fill="#fff" text-anchor="middle">🎒</text>
  </g>

  <!-- Market Illustration Area -->
  <g transform="translate(0, 195)">
    <!-- Market Stalls -->
    <rect x="20" y="30" width="360" height="150" fill="#f59e0b" opacity="0.2"/>
    <path d="M20 30 L200 0 L380 30 Z" fill="#dc2626" opacity="0.8"/>
    
    <!-- Fruits & Market Baskets -->
    <circle cx="70" cy="120" r="15" fill="#ef4444"/>
    <circle cx="95" cy="120" r="15" fill="#f59e0b"/>
    <circle cx="120" cy="120" r="15" fill="#10b981"/>

    <!-- Kids Character Placeholders -->
    <!-- Boy -->
    <circle cx="160" cy="80" r="18" fill="#78350f"/>
    <rect x="145" y="100" width="30" height="60" rx="4" fill="#22c55e"/>

    <!-- Girl -->
    <circle cx="240" cy="80" r="18" fill="#78350f"/>
    <polygon points="220,160 260,160 250,100 230,100" fill="#e11d48"/>
  </g>

  <!-- Bottom Badge -->
  <rect x="330" y="365" width="60" height="25" fill="#dc2626" rx="3"/>
  <text x="360" y="382" font-family="sans-serif" font-weight="bold" font-size="12" fill="#fff" text-anchor="middle">BOOK</text>
</svg>