<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="glow" cx="50%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#b45309" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="#0b0f19"/>
  <rect width="400" height="400" fill="url(#glow)"/>

  <!-- Ornate Border -->
  <rect x="12" y="12" width="376" height="376" fill="none" stroke="rgba(245, 158, 11, 0.4)" stroke-width="2" rx="4"/>
  <rect x="18" y="18" width="364" height="364" fill="none" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1" rx="2"/>

  <!-- Title Top -->
  <text x="200" y="70" font-family="'Georgia', serif" font-weight="900" font-size="34" fill="#ffffff" text-anchor="middle" letter-spacing="2">MEDITATIONS</text>
  <text x="200" y="110" font-family="'Brush Script MT', 'Georgia', cursive" font-style="italic" font-weight="bold" font-size="38" fill="url(#goldText)" text-anchor="middle">FOR Spiritual</text>
  <text x="200" y="160" font-family="'Georgia', serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="3">GROWTH</text>

  <!-- Subtitle -->
  <text x="200" y="195" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">Inspiring Christians to Move Beyond</text>
  <text x="200" y="210" font-family="sans-serif" font-size="11" fill="#e2e8f0" text-anchor="middle" letter-spacing="0.5">Indifference to a Life of Bold Faith and Devotion</text>

  <!-- Glowing Open Bible Graphic -->
  <g transform="translate(100, 240)">
    <!-- Light Ray Aura -->
    <path d="M100 -20 L30 120 L170 120 Z" fill="rgba(254, 240, 138, 0.15)"/>
    <!-- Bible Base -->
    <path d="M10 90 Q 100 70 190 90 L190 110 Q 100 90 10 110 Z" fill="#451a03"/>
    <!-- Left Page -->
    <path d="M15 88 Q 100 68 100 88 L100 105 Q 15 88 15 88 Z" fill="#fffbeb"/>
    <!-- Right Page -->
    <path d="M185 88 Q 100 68 100 88 L100 105 Q 185 88 185 88 Z" fill="#fef3c7"/>
    <!-- Glowing Cross Light -->
    <line x1="100" y1="20" x2="100" y2="70" stroke="#fef08a" stroke-width="3" opacity="0.9"/>
    <line x1="85" y1="35" x2="115" y2="35" stroke="#fef08a" stroke-width="3" opacity="0.9"/>
  </g>
</svg>