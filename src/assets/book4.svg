<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="techBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <rect width="400" height="400" fill="url(#techBg)"/>
  
  <!-- Cyber Grid Lines -->
  <path d="M0 100 L400 100 M0 200 L400 200 M0 300 L400 300" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>
  <path d="M100 0 L100 400 M200 0 L200 400 M300 0 L300 400" stroke="rgba(56, 189, 248, 0.15)" stroke-width="1"/>

  <!-- Badge Top -->
  <rect x="80" y="45" width="240" height="35" rx="8" fill="url(#neonBlue)"/>
  <text x="200" y="68" font-family="sans-serif" font-weight="bold" font-size="14" fill="#fff" text-anchor="middle" letter-spacing="1">MASTERING ICT &amp; AI</text>

  <!-- Central Graphic (Brain / Circuit) -->
  <circle cx="200" cy="185" r="50" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="200" cy="185" r="35" fill="rgba(6, 182, 212, 0.2)"/>
  <text x="200" y="195" font-family="sans-serif" font-weight="900" font-size="32" fill="#38bdf8" text-anchor="middle">🤖</text>

  <!-- Titles -->
  <text x="200" y="275" font-family="sans-serif" font-weight="800" font-size="22" fill="#ffffff" text-anchor="middle">Artificial Intelligence</text>
  <text x="200" y="305" font-family="sans-serif" font-weight="600" font-size="16" fill="#38bdf8" text-anchor="middle">&amp; Graphic Design Handbook</text>

  <text x="200" y="360" font-family="sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Practical Guide for Professionals</text>
</svg>