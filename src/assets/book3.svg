<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pastelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="coralRibbon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
  </defs>

  <!-- Pastel Background -->
  <rect width="400" height="400" fill="url(#pastelBg)"/>

  <!-- Top Title "LET'S LEARN" -->
  <text x="200" y="38" font-family="'Comic Sans MS', sans-serif" font-weight="bold" font-size="20" fill="#0d9488" text-anchor="middle">✏️ LET'S LEARN</text>

  <!-- Main Title "KINYARWANDA" -->
  <text x="200" y="80" font-family="'Comic Sans MS', 'Arial', sans-serif" font-weight="900" font-size="34" fill="#0f172a" text-anchor="middle">KINYARWANDA</text>

  <!-- Subtitle Ribbon -->
  <rect x="35" y="95" width="330" height="28" rx="6" fill="url(#coralRibbon)"/>
  <text x="200" y="114" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">Amagambo Akoroshwa Ku Isoko Ku Bana (Imyaka 8-12)</text>

  <!-- Market Frame / Oval Photo Graphic -->
  <g transform="translate(100, 140)">
    <ellipse cx="100" cy="90" rx="90" ry="70" fill="#0284c7" opacity="0.15"/>
    <ellipse cx="100" cy="90" rx="84" ry="64" fill="#ffffff"/>
    
    <!-- Mother & Kid illustration placeholder -->
    <circle cx="100" cy="70" r="24" fill="#78350f"/>
    <path d="M70 140 Q 100 100 130 140 Z" fill="#0284c7"/>
    <circle cx="65" cy="85" r="16" fill="#78350f"/>
    <path d="M45 140 Q 65 110 85 140 Z" fill="#22c55e"/>
  </g>

  <!-- Bottom Badges -->
  <text x="180" y="340" font-family="sans-serif" font-weight="900" font-size="26" fill="#0f172a" text-anchor="middle">PART 1</text>

  <!-- Book 4 Badge -->
  <rect x="295" y="300" width="75" height="60" rx="10" fill="#a5f3fc" stroke="#0891b2" stroke-width="2"/>
  <text x="332" y="325" font-family="sans-serif" font-weight="bold" font-size="12" fill="#0891b2" text-anchor="middle">BOOK</text>
  <text x="332" y="352" font-family="sans-serif" font-weight="900" font-size="24" fill="#0891b2" text-anchor="middle">4</text>
</svg>